<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tide Clock · Directory</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Ubuntu+Sans:wght@400;500&display=swap" rel="stylesheet"><style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--peach:#E8956A;--lilac:#A78BDF;--grad:linear-gradient(135deg,#E8956A,#A78BDF);--pi:#1a1616;--soft:#6c645d;--faint:#776e67;--line:#efe9e2;--ease:cubic-bezier(.4,0,.2,1);--t:.45s}
    html,body{background:#f1e9db;color:var(--pi);font:400 15px/1.6 'Ubuntu Sans','Helvetica Neue',sans-serif}
    a{color:inherit}
    .page{padding:clamp(20px,3.6vw,44px)}
    .sheet{max-width:1180px;margin:0 auto;background:#f7f5f2;border-radius:14px;box-shadow:0 18px 44px rgba(60,40,20,.18);padding:34px clamp(18px,3.2vw,44px) 44px}
    .eb{display:flex;justify-content:space-between;align-items:center;font:400 13px/1 'Ubuntu Sans',sans-serif;color:var(--faint)}
    .eb a{font-weight:500;text-decoration:none;transition:color var(--t) var(--ease)} .eb a:hover{color:var(--pi)}
    h1{font:500 clamp(30px,3.6vw,44px)/1.04 'Ubuntu Sans',sans-serif;letter-spacing:-.025em;margin:10px 0 0}
    h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
    .lede{font:400 16px/1.55 'Ubuntu Sans',sans-serif;color:var(--soft);max-width:62ch;margin-top:12px}
    .cards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;margin-top:24px}
    .card{background:#fff;border-radius:12px;padding:16px 18px;min-width:0}
    .w6{grid-column:span 6}.w4{grid-column:span 4}.w3{grid-column:span 3}.w2{grid-column:span 2}
    @media (max-width:820px){.w4,.w3,.w2{grid-column:span 6}}
    .card h3{font:500 13px/1 'Ubuntu Sans',sans-serif;color:var(--faint);margin-bottom:14px;display:flex;justify-content:space-between;gap:10px}
    .stat b{display:block;font:500 34px/1 'Ubuntu Sans',sans-serif;letter-spacing:-.03em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;width:max-content}
    .stat .lab{display:block;font:400 12.5px/1.35 'Ubuntu Sans',sans-serif;color:var(--soft);margin-top:4px}
    .stat .tip{font:400 12px/1.4 'Ubuntu Sans',sans-serif;color:var(--faint);margin-top:12px}
    .wk-tot{font:500 28px/1 'Ubuntu Sans',sans-serif;letter-spacing:-.02em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin:-4px 0 14px;width:max-content}
    .commits{display:flex;gap:6px;align-items:flex-end;height:70px}
    .commits i{flex:1;min-height:2px;border-radius:3px 3px 0 0;background:linear-gradient(180deg,var(--lilac),var(--peach));opacity:.85}
    .commits i.zero{background:#ece5dd} .commits i.later{background:none;border-bottom:2px dotted #e2d9cf;border-radius:0}
    .c-lab{display:flex;justify-content:space-between;font:400 11px/1 'Ubuntu Sans',sans-serif;color:var(--faint);margin-top:6px}
    .c-lab span{flex:1;text-align:center}
    .c-empty{font:400 12px/1.4 'Ubuntu Sans',sans-serif;color:var(--faint)}
    .list{list-style:none}
    .list li{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:baseline;padding:11px 0;border-top:1px solid var(--line);font:400 14px/1.4 'Ubuntu Sans',sans-serif}
    .list li:first-child{border-top:0;padding-top:0}
    .list .v{font:400 12px/1 'Ubuntu Sans',sans-serif;color:var(--faint);white-space:nowrap}
    .list a{font:500 12px/1 'Ubuntu Sans',sans-serif;color:var(--soft);text-decoration:none;transition:color var(--t) var(--ease)} .list a:hover{color:var(--pi)}
    .list b{font:500 15px/1.3 'Ubuntu Sans',sans-serif}
    .keeps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
    @media (max-width:760px){.keeps{grid-template-columns:1fr}}
    .keeps img{width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top;border-radius:8px;display:block;background:#e9e4de}
    .keeps figcaption{font:500 13px/1.3 'Ubuntu Sans',sans-serif;margin-top:8px}
    .keeps figcaption small{display:block;font:400 12px/1.3 'Ubuntu Sans',sans-serif;color:var(--faint)}
    .slots{display:grid;gap:8px;grid-template-columns:1fr 1fr 1fr}
    .slot{background:#f3eee8;border-radius:10px;aspect-ratio:16/9}
    .keep-note{font:400 12px/1.45 'Ubuntu Sans',sans-serif;color:var(--faint);margin-top:10px}
    .note{font:400 13px/1.5 'Ubuntu Sans',sans-serif;color:var(--soft)}
    .also{margin:14px 0 0;font:400 12px/1.5 'Ubuntu Sans',sans-serif;color:var(--faint)}
    /* Hear the Story (round 5): the app's soft rect, a squircle play button, no pill, no stroke */
    .listen{display:flex;align-items:center;gap:16px;margin:20px 0 4px;padding:10px 20px 10px 10px;background:#fff;border-radius:12px;width:max-content;max-width:100%}
    .listen[hidden]{display:none}
    .listen .play{width:34px;height:34px;border-radius:10px;border:0;background:var(--grad);display:grid;place-items:center;flex:none;cursor:pointer;transition:filter var(--t) var(--ease)}
    .listen .play:hover{filter:brightness(1.1)}
    .listen .play svg{width:12px;height:12px;fill:#100F11}
    .listen .lt{font:500 12.5px/1.2 'Ubuntu Sans',sans-serif}
    .listen .lt small{display:block;font:400 11px/1.3 'Ubuntu Sans',sans-serif;color:var(--faint)}
    .listen .bar{width:140px;height:4px;border-radius:2px;background:#ebe5de;overflow:hidden}
    .listen .bar i{display:block;height:100%;width:0;background:var(--grad)}
    /* round 8: the rich Week page (protos/mirror week page) */
    .stat{display:grid;gap:4px;align-content:start}
    .card h3 span{font-weight:400}
    .card h3 a{font-weight:400;text-decoration:none;transition:color var(--t) var(--ease)} .card h3 a:hover{color:var(--pi)}
    .repl{list-style:none;display:grid}
    .repl li{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1fr) minmax(0,1.6fr);gap:14px;padding:10px 0;border-top:1px solid var(--line);font:400 13.5px/1.45 'Ubuntu Sans',sans-serif}
    .repl li:first-child{border-top:0;padding-top:0}
    .repl .was{color:var(--faint);text-decoration:line-through;text-decoration-color:#d9cfc4} .repl .now{font-weight:500} .repl .why{color:var(--soft)}
    @media (max-width:760px){.repl li{grid-template-columns:1fr}}
    .builds{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:16px}
    .builds.many{grid-auto-flow:column;grid-template-columns:none;grid-auto-columns:calc((100% - 32px)/3);overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
    .builds.many > div{scroll-snap-align:start}
    @media (max-width:760px){.builds{grid-template-columns:1fr}}
    .build a{color:inherit;text-decoration:none;display:block}
    .build img,.build .ph{width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top;border-radius:8px;display:block;background:#e9e4de}
    .build .ph{background:linear-gradient(135deg,#f8d3bd,#e7d2ec 55%,#dacdf6)}
    .build b{display:flex;align-items:baseline;gap:8px;font:500 14px/1.25 'Ubuntu Sans',sans-serif;margin:10px 0 0}
    .build b small{font:400 12px/1 'Ubuntu Sans',sans-serif;color:var(--faint)}
    .vers{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
    .lp{position:relative;isolation:isolate;border:0;border-radius:6px;padding:6px 11px;font:500 12px/1 'Ubuntu Sans',sans-serif;background:#f3eee8;color:#4e4741;text-decoration:none;display:inline-block;cursor:pointer;transition:color var(--t) var(--ease)}
    .lp::after{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;background:linear-gradient(135deg,#f8d3bd,#e7d2ec 55%,#dacdf6);opacity:0;transition:opacity var(--t) var(--ease)}
    .lp:hover,.lp.cur{color:#1a1616} .lp:hover::after,.lp.cur::after{opacity:1}
    .vers .lp{font-size:11px;padding:5px 7px}
    .two{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:26px}
    @media (max-width:760px){.two{grid-template-columns:1fr}}
    .card h3.lefth{justify-content:flex-start;gap:6px;align-items:center}
    .qs,.todo{list-style:none}
    .qs li{padding:11px 0;border-top:1px solid var(--line)} .qs li:first-child{border-top:0;padding-top:0}
    .qs .q{font:400 14px/1.4 'Ubuntu Sans',sans-serif} .qs li.closed .q{color:var(--faint)}
    .qs .acts{display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap}
    .qs .res{font:500 12px/1 'Ubuntu Sans',sans-serif;color:var(--soft)}
    .qs-n{font:400 12px/1 'Ubuntu Sans',sans-serif;color:var(--faint)}
    .ok-mark{display:inline-flex;color:var(--faint)} .ok-mark svg{width:14px;height:14px}
    .todo li{display:grid;grid-template-columns:16px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);font:400 14px/1.4 'Ubuntu Sans',sans-serif}
    .todo li:first-child{border-top:0;padding-top:0}
    .todo .bx{position:relative;width:14px;height:14px;border-radius:4px;border:1.5px solid #d6ccc1;margin-top:3px;cursor:pointer;transition:background var(--t) var(--ease),border-color var(--t) var(--ease)}
    .todo .bx::after{content:"";position:absolute;left:3.5px;top:.5px;width:3.5px;height:7px;border:solid #fff;border-width:0 1.5px 1.5px 0;transform:rotate(45deg);opacity:0;transition:opacity var(--t) var(--ease)}
    .todo li.done .bx{background:var(--faint);border-color:transparent} .todo li.done .bx::after{opacity:1}
    .todo li.done .tx{color:var(--faint);text-decoration:line-through;text-decoration-color:#cfc5ba}
    .todo small{display:block;font:400 12px/1.35 'Ubuntu Sans',sans-serif;color:var(--faint);margin-top:2px}
    .kthumbs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
    .kthumbs img,.kthumbs video{width:100%;aspect-ratio:4/3;object-fit:cover;object-position:top;border-radius:6px;display:block;background:#e9e4de}
    .slots{grid-template-columns:1fr 1fr}
    .agents{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
    @media (max-width:760px){.agents{grid-template-columns:1fr}}
    .agents b{display:block;font:500 14px/1.3 'Ubuntu Sans',sans-serif;margin-bottom:4px}
    .agents p{font:400 13px/1.5 'Ubuntu Sans',sans-serif;color:#5f5750}</style></head><body><div class="page"><article class="sheet">
  <div class="eb">Tide Clock</div>
  <h1>The <em>directory</em></h1>
  <div class="cards"><div class="card w6"><h3>Every week<span>1</span></h3><ul class="list"><li><b>Week 43<small style="font-weight:400;color:var(--faint);margin-left:8px">Oct 19-25, 2026</small></b><a href="2026-W43-tide-clock.html">Open →</a></li></ul></div></div></article></div></body></html>
