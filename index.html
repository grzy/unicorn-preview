<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Unicorn</title>
<meta name="description" content="A creative OS for designers who work in the terminal. A live demo with sample data.">
<link rel="preload" href="fonts/ubuntu-sans-400.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: 'Ubuntu Sans'; font-weight: 400; font-display: swap; src: url('fonts/ubuntu-sans-400.woff2') format('woff2'); }
  @font-face { font-family: 'Ubuntu Sans'; font-weight: 600; font-display: swap; src: url('fonts/ubuntu-sans-600.woff2') format('woff2'); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #191919 url('field-painting.jpg') center / cover no-repeat; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: transparent; color-scheme: dark; }
  #mac-bar { display: none; }

  /* Big screens: a real desktop. A macOS menu bar on top, and the Unicorn
     window centered at a laptop's size, scaled up a touch, with its edge. */
  html.big #app {
    inset: auto; left: 0; top: 0; width: 1480px; height: 1060px;
    transform-origin: 0 0; border-radius: 12px;
    box-shadow: 0 0 0 .5px rgba(0,0,0,.5), 0 30px 90px rgba(0,0,0,.45), 0 10px 30px rgba(0,0,0,.25);
  }
  /* before the click: only the painting and the gate */
  html.big:not(.revealed) #mac-bar { opacity: 0; }
  html.big:not(.revealed) #app { box-shadow: none; }
  html.big #mac-bar, html.big #app { transition: opacity .6s cubic-bezier(.4,0,.2,1), box-shadow .6s cubic-bezier(.4,0,.2,1); }
  html.big #mac-bar {
    display: flex; align-items: center; gap: 20px; position: fixed; top: 0; left: 0; right: 0; height: 26px; padding: 0 18px;
    background: rgba(26,24,28,.42); -webkit-backdrop-filter: blur(30px) saturate(1.4); backdrop-filter: blur(30px) saturate(1.4);
    font: 400 13px/1 -apple-system, BlinkMacSystemFont, 'Ubuntu Sans', 'Helvetica Neue', sans-serif; color: rgba(255,255,255,.92);
    text-shadow: 0 1px 1px rgba(0,0,0,.25); -webkit-user-select: none; user-select: none; z-index: 2;
  }
  #mac-bar svg { width: 13px; height: 16px; display: block; margin-top: -1px; fill: currentColor; }
  #mac-bar b { font-weight: 600; }
  #mac-bar .r { margin-left: auto; display: flex; gap: 14px; }
</style>
<script>
  // big = a desktop-sized screen; laptops and phones get the app full-bleed
  const BIG = () => innerWidth >= 1800 && innerHeight >= 1000;
  document.documentElement.classList.toggle('big', BIG());
</script>
</head>
<body>
<div id="mac-bar" aria-hidden="true">
  <svg viewBox="0 0 814 1000"><path d="M788 341c-6 4-108 62-108 190 0 148 130 200 134 202-1 3-21 72-69 142-43 62-88 124-156 124s-86-40-164-40c-76 0-104 41-166 41s-106-57-156-128C45 789 0 664 0 545c0-191 124-292 246-292 65 0 119 43 160 43 39 0 100-45 174-45 28 0 129 2 196 98zM558 159c31-37 53-88 53-139 0-7-1-14-2-20-50 2-110 34-146 76-28 32-55 83-55 135 0 8 1 15 2 18 3 0 8 1 13 1 45 0 102-30 135-71z"/></svg>
  <b>Unicorn</b><span>File</span><span>Edit</span><span>View</span><span>Window</span><span>Help</span>
  <span class="r"><span id="mac-clock"></span></span>
</div>
<iframe id="app" title="Unicorn, a live demo with sample data" allow="autoplay"></iframe>
<script>
(() => {
  const app = document.getElementById('app'), clock = document.getElementById('mac-clock');
  app.src = 'app.html';
  const W = 1480, H = 1060, BAR = 26;
  const fit = () => {
    const big = BIG();
    document.documentElement.classList.toggle('big', big);
    if (big) {
      // about 1600px wide on a 27" screen; never touching the menu bar or the edges
      const s = Math.min(1, (innerWidth - 160) / W, (innerHeight - BAR - 72) / H);
      const x = Math.round((innerWidth - W * s) / 2), y = Math.round(BAR + (innerHeight - BAR - H * s) / 2);
      app.style.transform = `translate(${x}px, ${y}px) scale(${s})`;
    } else app.style.transform = '';
    try { app.contentDocument.documentElement.classList.toggle('framed', big); } catch (e) {}
    try { app.contentWindow.postMessage({ framed: big }, location.origin); } catch (e) {}
  };
  addEventListener('message', (e) => { if (e.origin === location.origin && e.data && 'revealed' in e.data) document.documentElement.classList.toggle('revealed', !!e.data.revealed); });
  addEventListener('resize', fit); app.addEventListener('load', fit); fit();
  const tick = () => {
    const d = new Date();
    clock.textContent = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) + ' ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  };
  tick(); setInterval(tick, 15000);
})();
</script>
<!-- big screens: Peach and Lilac roam the whole viewport, above the app window -->
<script>window.GUEST_PREVIEW = true; window.ROAM_HOST = 'shell';</script>

</body>
</html>
